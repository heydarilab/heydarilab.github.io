<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Open Graph social card.
    Hand-crafted to match the lab's editorial look. 1.91:1 aspect ratio,
    which is the canonical OG / Twitter card size. If you want broader
    compatibility with older social platforms, rasterize this to PNG at
    1200x630 and reference public/og-image.png from BaseLayout.astro.
  -->
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBF1"/>
      <stop offset="100%" stop-color="#F4ECDA"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E07B3F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E07B3F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Drifting network motif on the right -->
  <g transform="translate(840,315)">
    <g stroke="#1B2A3A" stroke-opacity="0.25" stroke-width="1.25" fill="none">
      <line x1="-180" y1="-110" x2="-50" y2="-40"/>
      <line x1="-50" y1="-40" x2="80" y2="-90"/>
      <line x1="-50" y1="-40" x2="60" y2="40"/>
      <line x1="-50" y1="-40" x2="-120" y2="80"/>
      <line x1="60" y1="40" x2="160" y2="100"/>
      <line x1="60" y1="40" x2="80" y2="-90"/>
      <line x1="-120" y1="80" x2="-40" y2="160"/>
      <line x1="-40" y1="160" x2="80" y2="170"/>
      <line x1="80" y1="170" x2="160" y2="100"/>
      <line x1="-180" y1="-110" x2="80" y2="-90"/>
    </g>
    <circle cx="-180" cy="-110" r="9" fill="#E07B3F"/>
    <circle cx="80" cy="-90" r="9" fill="#3A8C8C"/>
    <circle cx="160" cy="100" r="9" fill="#D4A02A"/>
    <circle cx="-120" cy="80" r="8" fill="#1B2A3A"/>
    <circle cx="-40" cy="160" r="8" fill="#E07B3F"/>
    <circle cx="80" cy="170" r="8" fill="#3A8C8C"/>
    <circle cx="-50" cy="-40" r="12" fill="#FFFBF1" stroke="#1B2A3A" stroke-width="1.5"/>
    <circle cx="60" cy="40" r="12" fill="#FFFBF1" stroke="#1B2A3A" stroke-width="1.5"/>
  </g>

  <!-- Left-side textual block -->
  <g font-family="'Fraunces', Georgia, serif" font-weight="500" fill="#1B2A3A">
    <text x="80" y="200" font-size="74" letter-spacing="-1">
      <tspan fill="#E07B3F">M</tspan><tspan fill="#D4A02A">A</tspan><tspan>GICS</tspan>
      <tspan fill="#1B2A3A"> Lab</tspan>
    </text>
    <text x="80" y="280" font-size="34" font-weight="400" fill="#34465A">
      Design &amp; Governance
    </text>
    <text x="80" y="320" font-size="34" font-weight="400" fill="#34465A">
      of Intelligent Complex Systems.
    </text>
  </g>

  <g font-family="'Inter', sans-serif">
    <line x1="80" y1="364" x2="200" y2="364" stroke="#E07B3F" stroke-width="3"/>
    <text x="80" y="410" font-size="18" fill="#5B6C7E">
      Multi-agent · Networked · Sociotechnical
    </text>
    <text x="80" y="540" font-size="16" letter-spacing="3" fill="#34465A" font-weight="600">
      NORTHEASTERN UNIVERSITY · MAGICS LAB
    </text>
  </g>
</svg>
